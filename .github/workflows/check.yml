name: Prüfen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Browser tests (Bauplan 3, E1): iPhone size, servers replaced, no real account.
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: oberflaechentests
          path: apps/web/playwright-report/
          retention-days: 7
